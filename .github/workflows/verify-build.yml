name: Verify and Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Projekt prüfen und Build erzeugen
        run: npm run verify

      - name: Produktions-Build als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: bernds-blog-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
